      <stop offset="1" stop-color="#0A1A2B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1035 10) rotate(90) scale(300 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33D5FF" stop-opacity="0.30"/>
