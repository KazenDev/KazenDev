  <text x="640" y="266" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="0.6" fill="#8B949E">Minecraft &#183; Bots &#183; IA aplicada &#183; Automatizaci&#243;n</text>

