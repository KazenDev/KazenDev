name: Actualizar actividad

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar token
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret ACTIVITY_TOKEN (PAT con scope read:user)."
            exit 1
          fi

      - name: Regenerar panel
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: python scripts/update_activity.py

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actividad: actualización automática"
            git push
          fi
